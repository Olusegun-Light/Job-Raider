name: Job Radar

on:
  schedule:
    # 06:00 UTC = 07:00 Lagos. GitHub's scheduler can run late under load.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Time window to scan'
        type: choice
        options: [day, week]
        default: day
      keep_no_sponsor:
        description: 'Keep UK roles that state they cannot sponsor'
        type: boolean
        default: false

# Two overlapping runs would both read seen.json, both deliver the same jobs,
# and then race to push it back.
concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run job radar
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: info
        run: |
          npm run jobs -- \
            --window=${{ inputs.window || 'day' }} \
            ${{ inputs.keep_no_sponsor && '--keep-no-sponsor' || '' }}

      - name: Commit the dedupe store if it changed
        # Runs even when the radar step failed: jobs already delivered before
        # the failure must still be recorded, or they are sent again tomorrow.
        if: always()
        run: |
          if [[ -z "$(git status --porcelain data/seen.json)" ]]; then
            echo "seen.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update seen [skip ci]"
          # The scheduled run and a manual run can both push; rebase instead
          # of failing the whole job on a non-fast-forward.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
