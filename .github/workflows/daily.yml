name: Job Radar

on:
  schedule:
    # 06:00 UTC = 07:00 Lagos. GitHub's scheduler can run late under load.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Time window to scan'
        type: choice
        options: [day, week]
        default: day
      keep_unreachable:
        description: 'Keep roles needing a visa nobody offers (debugging the filters)'
        type: boolean
        default: false

# Two overlapping runs would both read seen.json, both deliver the same jobs,
# and then race to push it back.
concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh the UK sponsor register
        # Not committed (10.4MB, republished most working days), so it is
        # fetched per run. Non-fatal: it only adds a +2 scoring signal and a
        # badge, and gov.uk being down must not cost us the whole digest.
        continue-on-error: true
        run: npm run update-sponsors

      - name: Run job radar
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: info
        run: |
          npm run jobs -- \
            --window=${{ inputs.window || 'day' }} \
            ${{ inputs.keep_unreachable && '--keep-unreachable' || '' }}

      - name: Commit the run state if it changed
        # Runs even when the radar step failed, because the register refresh or
        # a later step can fail after a digest was delivered and recorded. A
        # failure *during* delivery writes nothing, so there is simply nothing
        # to commit and this exits early.
        if: always()
        run: |
          # discovered.json feeds `npm run discover`; without committing it,
          # every suggestion dies with the ephemeral runner.
          if [[ -z "$(git status --porcelain data/seen.json data/discovered.json)" ]]; then
            echo "no run state changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/discovered.json
          git commit -m "chore: update seen [skip ci]"
          # The scheduled run and a manual run can both push; rebase instead
          # of failing the whole job on a non-fast-forward.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
